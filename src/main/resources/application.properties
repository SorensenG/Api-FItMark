spring.application.name=FitMark
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Api-FitMark}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.pool-name=FitMarkHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:1}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT:3000}
spring.datasource.hikari.initialization-fail-timeout=${DB_POOL_INITIALIZATION_FAIL_TIMEOUT:-1}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_ALLOW_JDBC_METADATA_ACCESS:false}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

jwt.secret=${JWT_SECRET:change-me-with-at-least-32-characters-secret}
security.token-pepper=${SECURITY_TOKEN_PEPPER:}

app.mail.brevo-api-key=${BREVO_API_KEY:disabled}
app.mail.from=${MAIL_FROM:no-reply@example.com}
app.mail.from-name=${MAIL_FROM_NAME:FitMark}

app.security.expose-swagger=${APP_SECURITY_EXPOSE_SWAGGER:false}
